<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Gallery with button
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-button expand="full" (click)="toggleImages()">Show Images</ion-button>

  <div *ngIf="showImages">
    <ion-grid>
      <ion-row>
        <ion-col *ngFor="let photo of photoService.photos">
          <ion-img [src]="photo.webviewPath"></ion-img>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
